name: PR 120105 exact timing proof

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact PR head SHA to exercise
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: \${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Run production timing proof
        env:
          TARGET_SHA: \${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          timings="$RUNNER_TEMP/vitest-shard-timings.json"
          export OPENCLAW_TEST_PROJECTS_TIMINGS_PATH="$timings"
          export OPENCLAW_VITEST_MAX_WORKERS=1

          node --import tsx scripts/test-projects.mts \
            src/agents/agent-bundle-mcp-manager.requester-connect.test.ts \
            src/agents/agent-bundle-mcp-harness.test.ts

          first_key="$(jq -r '.configs | keys[0]' "$timings")"
          first_count="$(jq -r --arg key "$first_key" '.configs[$key].sampleCount' "$timings")"

          node --import tsx scripts/test-projects.mts \
            src/agents/agent-bundle-mcp-harness.test.ts \
            src/agents/agent-bundle-mcp-manager.requester-connect.test.ts

          second_key="$(jq -r --arg key "$first_key" '.configs[$key] | if . == null then "" else $key end' "$timings")"
          second_count="$(jq -r --arg key "$first_key" '.configs[$key].sampleCount' "$timings")"

          echo "Proof artifact: two production test-project runs passed"
          echo "Verified checkout SHA: $(git rev-parse HEAD)"
          echo "First key:        $first_key"
          echo "First sampleCount: $first_count"
          echo "Second key:       $second_key"
          echo "Second sampleCount: $second_count"
          test "$first_key" = "$second_key"
          test "$second_count" -eq "$((first_count + 1))"