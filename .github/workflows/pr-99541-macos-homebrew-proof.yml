name: PR 99541 macOS Homebrew proof

on:
  workflow_dispatch:
  push:
    branches:
      - codex/pr-99541-macos-proof

permissions:
  contents: read

concurrency:
  group: pr-99541-macos-homebrew-proof-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PR_99541_TARGET_REPOSITORY: qingminglong/openclaw
  PR_99541_TARGET_REF: codex/issue-99183-stale-node-execpath
  PR_99541_TARGET_SHA: 7d53310605e9fd111db375d479cc5f22da2f42db

jobs:
  macos-homebrew-proof:
    name: Real macOS Homebrew stale Cellar proof
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ env.PR_99541_TARGET_REPOSITORY }}
          ref: ${{ env.PR_99541_TARGET_REF }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Run macOS Homebrew proof
        shell: bash
        run: |
          bash scripts/github/pr-99541-macos-homebrew-proof.sh \
            target \
            "${PR_99541_TARGET_SHA}"

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-99541-macos-homebrew-proof
          path: ${{ runner.temp }}/pr-99541-macos-homebrew-proof
          if-no-files-found: warn
