name: Temporary exact-head config schema proof

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to execute in this isolated proof run
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  proof:
    name: Exact-head config schema CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          repository: qingminglong/openclaw
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify exact head
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$TARGET_SHA"
          echo "exact_head=$actual_sha"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Install pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        env:
          CI: "true"
        run: corepack pnpm install --frozen-lockfile --ignore-scripts=false --config.engine-strict=false

      - name: Run schema CLI
        shell: bash
        env:
          SCHEMA_FILE: ${{ runner.temp }}/schema.json
        run: |
          set -euo pipefail
          corepack pnpm openclaw config schema --json > "$SCHEMA_FILE"
          SCHEMA_FILE="$SCHEMA_FILE" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const schema = JSON.parse(readFileSync(process.env.SCHEMA_FILE, "utf8"));
          const wanted = new Set(["skipBootstrap", "contextInjection"]);
          const matches = [];

          function walk(value, path) {
            if (!value || typeof value !== "object") return;
            if (Array.isArray(value)) {
              value.forEach((item, index) => walk(item, `${path}[${index}]`));
              return;
            }
            for (const [key, child] of Object.entries(value)) {
              const childPath = path ? `${path}.${key}` : key;
              if (wanted.has(key) && child && typeof child === "object") {
                matches.push({ path: childPath, schema: child });
              }
              walk(child, childPath);
            }
          }

          walk(schema, "");
          const selected = matches.filter(({ path }) =>
            path.includes("agents.defaults.skipBootstrap") ||
            path.includes("agents.defaults.contextInjection"),
          );
          console.log(JSON.stringify(selected, null, 2));
          if (
            !selected.some(({ path }) => path.includes("agents.defaults.skipBootstrap")) ||
            !selected.some(({ path, schema: value }) =>
              path.includes("agents.defaults.contextInjection") &&
              Array.isArray(value.enum) &&
              ["always", "continuation-skip", "never"].every((item) => value.enum.includes(item)),
            )
          ) {
            console.error("Required schema entries or enum values were not found.");
            process.exit(1);
          }
          NODE